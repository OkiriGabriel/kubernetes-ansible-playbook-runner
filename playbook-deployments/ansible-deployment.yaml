---
# ConfigMap for Ansible configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ansible-config
data:
  ansible.cfg: |
    [defaults]
    host_key_checking = False
    remote_user = root
    private_key_file = /keys/ansible-key
    inventory = /inventory/hosts
    
  playbook.yml: |
    ---
    - name: Web server setup
      hosts: webservers
      become: yes
      tasks:
        - name: Update package cache
          apt:
            update_cache: yes
          when: ansible_os_family == "Debian"
        
        - name: Install nginx
          package:
            name: nginx
            state: present
        
        - name: Start nginx service
          service:
            name: nginx
            state: started
            enabled: yes
        
        - name: Create index.html
          copy:
            content: |
              <html>
                <body>
                  <h1>Deployed by Ansible in Kubernetes!</h1>
                  <p>Pod: {{ ansible_hostname }}</p>
                </body>
              </html>
            dest: /var/www/html/index.html

  hosts: |
    [webservers]
    server1 ansible_host=192.168.1.10
    server2 ansible_host=192.168.1.11
    
    [databases]
    db1 ansible_host=192.168.1.20

---
# Secret for SSH keys
apiVersion: v1
kind: Secret
metadata:
  name: ansible-ssh-key
type: Opaque
data:
  ansible-key: LS0tLS1CRUdJTiBPUEVOU1NIIFBSSVZBVEUgS0VZLS0tLS0K  # base64 encoded private key

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner
  labels:
    app: ansible-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner
  template:
    metadata:
      labels:
        app: ansible-runner
    spec:
      containers:
      - name: ansible
        image: ansible/ansible:latest
        command: ["/bin/bash"]
        args: ["-c", "while true; do sleep 30; done"]  # Keep container running
        volumeMounts:
        - name: config
          mountPath: /ansible
        - name: inventory
          mountPath: /inventory
        - name: ssh-key
          mountPath: /keys
          readOnly: true
        env:
        - name: ANSIBLE_CONFIG
          value: /ansible/ansible.cfg
        workingDir: /ansible
      volumes:
      - name: config
        configMap:
          name: ansible-config
      - name: inventory
        configMap:
          name: ansible-config
          items:
          - key: hosts
            path: hosts
      - name: ssh-key
        secret:
          secretName: ansible-ssh-key
          defaultMode: 0600