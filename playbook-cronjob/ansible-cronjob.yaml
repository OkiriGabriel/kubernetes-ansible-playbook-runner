---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ansible-maintenance
  labels:
    app: ansible-runner
    pattern: scheduled-cronjob
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: ansible-runner
            pattern: scheduled-cronjob
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ansible
              image: alpine/ansible:latest
              workingDir: /playbooks
              command: ["ansible-playbook"]
              args:
                - maintenance.yml
                - -i
                - /inventory/hosts
                - --limit
                - local
                - -v
              env:
                - name: ANSIBLE_CONFIG
                  value: /etc/ansible/ansible.cfg
                - name: ANSIBLE_HOST_KEY_CHECKING
                  value: "False"
              volumeMounts:
                - name: playbooks
                  mountPath: /playbooks
                - name: inventory
                  mountPath: /inventory
                - name: ansible-config
                  mountPath: /etc/ansible/ansible.cfg
                  subPath: ansible.cfg
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: playbooks
              configMap:
                name: ansible-playbooks
            - name: inventory
              configMap:
                name: ansible-inventory
            - name: ansible-config
              configMap:
                name: ansible-config
