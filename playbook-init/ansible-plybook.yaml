apiVersion: v1
kind: ConfigMap
metadata:
  name: ansible-playbooks
data:
  site.yml: |
    ---
    - hosts: all
      tasks:
        - name: Install package
          package:
            name: nginx
            state: present
---
apiVersion: v1
kind: Secret
metadata:
  name: ansible-ssh-key
type: Opaque
data:
  ssh-private-key: <base64-encoded-key>