apiVersion: v1
kind: Pod
spec:
  initContainers:
  - name: ansible-init
    image: ansible/ansible:latest
    command: ["ansible-playbook"]
    args: ["/playbooks/init.yml"]
    volumeMounts:
    - name: shared-data
      mountPath: /shared
  containers:
  - name: app
    image: myapp:latest
    volumeMounts:
    - name: shared-data
      mountPath: /app/data