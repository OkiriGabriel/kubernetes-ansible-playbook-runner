---
# ConfigMap for Ansible playbook
apiVersion: v1
kind: ConfigMap
metadata:
  name: ansible-playbooks
  namespace: default
data:
  site.yml: |
    ---
    - name: Sample playbook
      hosts: localhost
      connection: local
      gather_facts: false
      tasks:
        - name: Print hello message
          debug:
            msg: "Hello from Ansible in Kubernetes!"
        
        - name: Create a test file
          file:
            path: /tmp/ansible-test.txt
            state: touch
            
        - name: Write content to file
          copy:
            content: "Ansible executed successfully at {{ ansible_date_time.iso8601 }}"
            dest: /tmp/ansible-test.txt

---
# ConfigMap for inventory
apiVersion: v1
kind: ConfigMap
metadata:
  name: ansible-inventory
  namespace: default
data:
  hosts: |
    [local]
    localhost ansible_connection=local

---
# Job to run the Ansible playbook
apiVersion: batch/v1
kind: Job
metadata:
  name: ansible-job
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: ansible
        image: alpine/ansible
        command: ["ansible-playbook"]
        args: ["/playbooks/site.yml", "-i", "/inventory/hosts", "-v"]
        volumeMounts:
        - name: playbooks
          mountPath: /playbooks
        - name: inventory
        
          mountPath: /inventory
        env:
        - name: ANSIBLE_HOST_KEY_CHECKING
          value: "False"
      volumes:
      - name: playbooks
        configMap:
          name: ansible-playbooks
      - name: inventory
        configMap:
          name: ansible-inventory
      restartPolicy: Never
  backoffLimit: 3