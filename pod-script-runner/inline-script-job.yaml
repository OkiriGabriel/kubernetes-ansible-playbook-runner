---
apiVersion: batch/v1
kind: Job
metadata:
  name: inline-script-job
  labels:
    app: ansible-runner
    pattern: inline-script
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: ansible-runner
        pattern: inline-script
    spec:
      restartPolicy: Never
      containers:
        - name: script-runner
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Starting inline script"
              mkdir -p /app/config /app/data /app/logs
              cat > /app/config/app.json <<'EOF'
              {
                "app_name": "MyApplication",
                "version": "1.0.0",
                "environment": "demo"
              }
              EOF
              cat > /app/logs/deployment-report.txt <<EOF
              Deployment Summary
              ==================
              Date: $(date)
              Pod: ${HOSTNAME}
              Namespace: ${NAMESPACE}
              Status: SUCCESS
              EOF
              echo "Script completed"
              cat /app/logs/deployment-report.txt
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
