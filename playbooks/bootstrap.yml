---
- name: Bootstrap shared data for the application container
  hosts: local
  connection: local
  gather_facts: true
  vars:
    shared_dir: /shared
    config_file: /shared/app.conf

  tasks:
    - name: Create the shared directory
      ansible.builtin.file:
        path: "{{ shared_dir }}"
        state: directory
        mode: "0755"

    - name: Write bootstrap configuration
      ansible.builtin.copy:
        dest: "{{ config_file }}"
        content: |
          # Generated by the Ansible init container
          bootstrapped=true
          hostname={{ ansible_hostname }}
          generated_at={{ ansible_date_time.iso8601 }}
        mode: "0644"

    - name: Write a ready marker
      ansible.builtin.copy:
        dest: "{{ shared_dir }}/ready"
        content: "ok\n"
        mode: "0644"
